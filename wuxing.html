<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Five Elements Garden - Meditation</title>
<style>
/* Five Elements meditation space (design exploration). Separate from scan.html, which keeps the earlier hot flash prototype. */
:root {
  --ink: #f2f5f6;
  --ink-dim: rgba(242, 245, 246, .76);
  --glass: rgba(20, 27, 32, .5);
  --glass-line: rgba(255, 255, 255, .2);
  --ui: 'Helvetica Neue', Arial, system-ui, sans-serif;
  color-scheme: dark;
}
html, body { height: 100%; margin: 0; background: #0a1112; overflow: hidden; font-family: var(--ui); color: var(--ink); }
#stage { position: fixed; inset: 0; }
#stage canvas { display: block; width: 100%; height: 100%; touch-action: none; cursor: grab; }
.ui { position: fixed; inset: 0; display: flex; flex-direction: column; justify-content: space-between; gap: 12px; padding: 16px; box-sizing: border-box; pointer-events: none; }
.panel { background: var(--glass); border: 1px solid var(--glass-line); -webkit-backdrop-filter: blur(14px); backdrop-filter: blur(14px); }
.top { display: flex; flex-wrap: wrap; justify-content: space-between; align-items: flex-start; gap: 12px; }
.brand { padding: 12px 16px; border-radius: 14px; max-width: 380px; }
.brand h1 { margin: 0; font-size: 20px; font-weight: 400; }
.brand p { margin: 6px 0 0; font-size: 13px; line-height: 1.45; color: var(--ink-dim); }
.seg { display: flex; flex-wrap: wrap; gap: 2px; padding: 4px; border-radius: 999px; }
button { pointer-events: auto; font-family: var(--ui); cursor: pointer; }
.seg button { border: 0; background: transparent; color: var(--ink); padding: 8px 15px; border-radius: 999px; font-size: 13px; font-weight: 500; }
.seg button[aria-pressed="true"] { background: rgba(255, 255, 255, .92); color: #182126; }
.bottom { display: flex; flex-wrap: wrap; align-items: flex-end; gap: 12px; }
.status { padding: 7px 12px; border-radius: 999px; font-size: 12px; color: var(--ink-dim); }
.garden-only { display: none; }
input[type=range] { pointer-events: auto; vertical-align: middle; }
#vr { position: static !important; }
@media (max-width: 520px) { .status { display: none; } }
</style>
<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.180.0/examples/jsm/",
    "@sparkjsdev/spark": "https://sparkjs.dev/releases/spark/2.4.0/spark.module.js"
  }
}
</script>
</head>
<body>
<div id="stage"></div>

<main class="ui">
  <header class="top">
    <div class="brand panel">
      <h1>Five Elements Garden</h1>
      <p>A meditation space in the Xgrids scan of the China Garden. Design exploration.</p>
    </div>
    <div class="seg panel" role="group" aria-label="Preview">
      <button type="button" id="phCards" aria-pressed="true">Cards</button>
      <button type="button" id="phWood" aria-pressed="false">Wood session</button>
      <button type="button" id="phGarden" aria-pressed="false">Garden (preview)</button>
      <button type="button" id="replay" class="garden-only">Replay reveal</button>
      <button type="button" id="pick" class="garden-only" aria-pressed="false">Pick VR start</button>
      <button type="button" id="measure" class="garden-only" aria-pressed="false">Measure</button>
      <button type="button" id="person" class="garden-only" aria-pressed="false">1.7 m person</button>
    </div>
  </header>
  <footer class="bottom">
    <div class="status panel garden-only" id="scaleBox">Scene scale <input type="range" id="scale" min="0.3" max="3" step="0.01"> <b id="scaleVal"></b></div>
    <div class="status panel" id="status">Loading scan...</div>
    <div id="vrSlot"></div>
  </footer>
</main>

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { VRButton } from 'three/addons/webxr/VRButton.js';
import { XRHandModelFactory } from 'three/addons/webxr/XRHandModelFactory.js';
import { SparkRenderer, SplatMesh, dyno } from '@sparkjsdev/spark';

const $ = (id) => document.getElementById(id);
const stage = $('stage'), statusEl = $('status');
const clamp = (x, a = 0, b = 1) => Math.min(b, Math.max(a, x));
const lerp = (a, b, t) => a + (b - a) * t;

const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
renderer.xr.enabled = true;
stage.appendChild(renderer.domElement);

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x0a1112);
const camera = new THREE.PerspectiveCamera(60, 1, 0.1, 500);
// The camera lives inside a rig so that, in VR, the rig decides where in the world you stand.
const rig = new THREE.Group();
rig.add(camera);
scene.add(rig);

const spark = new SparkRenderer({ renderer });
scene.add(spark);

// 'cards' = misty room with five cards, 'wood' = the Wood meditation (scan appears out of the mist),
// 'garden' = a desktop-only overview of the scan for checking and picking points
let phase = 'cards';

/* =====================================================================
   PART 1: the misty dream room (no scan here)
   ===================================================================== */
// A big sphere around the viewer, painted by a small program on the graphics card (a fragment shader).
// Think of it as a p5.js draw() that runs once for every pixel, using noise() to get drifting mist.
const mistUniforms = { time: { value: 0 } };
const RIDGES = true;   // faint layered mountain silhouettes on the horizon; set to false for mist only
const mist = new THREE.Mesh(
  new THREE.SphereGeometry(60, 48, 32),
  new THREE.ShaderMaterial({
    uniforms: mistUniforms, side: THREE.BackSide, depthWrite: false,
    vertexShader: /* glsl */ `
      varying vec3 vDir;
      void main() { vDir = position; gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0); }
    `,
    fragmentShader: /* glsl */ `
      varying vec3 vDir;
      uniform float time;
      float h3(vec3 p) { p = fract(p * 0.3183099 + 0.1); p *= 17.0; return fract(p.x * p.y * p.z * (p.x + p.y + p.z)); }
      float n3(vec3 x) {
        vec3 i = floor(x), f = fract(x); f = f * f * (3.0 - 2.0 * f);
        return mix(mix(mix(h3(i), h3(i + vec3(1,0,0)), f.x), mix(h3(i + vec3(0,1,0)), h3(i + vec3(1,1,0)), f.x), f.y),
                   mix(mix(h3(i + vec3(0,0,1)), h3(i + vec3(1,0,1)), f.x), mix(h3(i + vec3(0,1,1)), h3(i + vec3(1,1,1)), f.x), f.y), f.z);
      }
      float fbm(vec3 p) { float s = 0.0, a = 0.5; for (int i = 0; i < 4; i++) { s += a * n3(p); p *= 2.02; a *= 0.5; } return s; }
      void main() {
        vec3 d = normalize(vDir);
        float horizon = exp(-abs(d.y) * 5.0);
        vec3 col = mix(vec3(0.02, 0.05, 0.06), vec3(0.07, 0.14, 0.15), smoothstep(-0.4, 0.6, d.y));
        col += vec3(0.10, 0.17, 0.16) * horizon * 0.8;
        ${RIDGES ? `
        float az = atan(d.x, d.z);
        for (int k = 0; k < 3; k++) {
          float fk = float(k);
          // cos and sin of the angle make the noise wrap around smoothly, so there is no seam behind your head
          float hgt = 0.12 - fk * 0.04 + 0.12 * n3(vec3(cos(az), sin(az), fk * 0.7) * (2.6 + fk * 1.1));
          vec3 rc = k == 0 ? vec3(0.17, 0.27, 0.27) : (k == 1 ? vec3(0.10, 0.18, 0.19) : vec3(0.05, 0.10, 0.11));
          col = mix(col, rc, smoothstep(hgt + 0.01, hgt - 0.01, d.y));
        }` : ''}
        // slow drifting mist: noise that is bent by more noise, moving a little each frame
        vec3 q = d * 2.2 + vec3(time * 0.02, time * 0.005, -time * 0.015);
        float n = fbm(q);
        float m = fbm(q * 1.7 + n * 1.5 + 4.0);
        float mistAmt = smoothstep(0.35, 0.78, m);
        col = mix(col, vec3(0.34, 0.46, 0.45), mistAmt * (0.22 + 0.5 * horizon));
        gl_FragColor = vec4(col, 1.0);
      }
    `,
  })
);
mist.renderOrder = -1;
scene.add(mist);

/* =====================================================================
   PART 2: five element cards, drawn on a 2D canvas (like p5.js) and hung in an arc around the viewer
   ===================================================================== */
// sizes are in metres: a card 0.7 m wide and 1.575 m tall hangs 3.0 m away, about 26 degrees apart (halfway between the first two versions)
const CARD_W = 0.7, CARD_H = 1.575, ARC_R = 3.0, ARC_STEP = 26 * Math.PI / 180, EYE = 1.5;
// left to right; Wood is in the middle because it is the first one we build
const ELEMENTS = [
  { id: 'metal', word: 'METAL', zh: '金', bg: '#6b5740', fg: '#d9c89a', shape: 'triangle' },
  { id: 'water', word: 'WATER', zh: '水', bg: '#1f5f7d', fg: '#d8dde0', shape: 'drop' },
  { id: 'wood',  word: 'WOOD',  zh: '木', bg: '#1f6b45', fg: '#e5a85a', shape: 'circle' },
  { id: 'fire',  word: 'FIRE',  zh: '火', bg: '#9b1c1c', fg: '#f2833a', shape: 'flame' },
  { id: 'earth', word: 'EARTH', zh: '土', bg: '#1c1a19', fg: '#d9c89a', shape: 'square' },
];
const CJK = '"Songti SC", "STSong", "Noto Serif CJK SC", "Source Han Serif SC", serif';

function drawCard(el) {
  const W = 512, H = Math.round(512 * CARD_H / CARD_W);
  const c = document.createElement('canvas'); c.width = W; c.height = H;
  const g = c.getContext('2d');
  g.fillStyle = el.bg; g.fillRect(0, 0, W, H);
  // paper grain: lots of short, faint horizontal strokes, light and dark
  for (let i = 0; i < 2600; i++) {
    const x = Math.random() * W, y = Math.random() * H, len = 8 + Math.random() * 60;
    g.fillStyle = Math.random() < 0.5 ? 'rgba(255,255,255,' + (0.03 + Math.random() * 0.07) + ')' : 'rgba(0,0,0,' + (0.04 + Math.random() * 0.09) + ')';
    g.fillRect(x, y, len, 1 + Math.random() * 1.5);
  }
  // symbol in the upper third
  const cx = W / 2, cy = H * 0.3;
  g.fillStyle = el.fg;
  g.beginPath();
  if (el.shape === 'circle') g.arc(cx, cy, 130, 0, Math.PI * 2);
  else if (el.shape === 'triangle') { g.moveTo(cx, cy - 135); g.lineTo(cx + 150, cy + 110); g.lineTo(cx - 150, cy + 110); g.closePath(); }
  else if (el.shape === 'square') g.rect(cx - 115, cy - 115, 230, 230);
  else if (el.shape === 'drop') {
    g.moveTo(cx, cy - 150); g.bezierCurveTo(cx + 20, cy - 90, cx + 100, cy - 20, cx + 100, cy + 40);
    g.arc(cx, cy + 40, 100, 0, Math.PI); g.bezierCurveTo(cx - 100, cy - 20, cx - 20, cy - 90, cx, cy - 150);
  } else {   // flame
    // a tall tongue with a smaller lick on the left: right side down, round the bottom, then back up the left side
    g.moveTo(cx + 10, cy - 175); g.bezierCurveTo(cx + 90, cy - 60, cx + 135, cy + 20, cx + 85, cy + 100);
    g.bezierCurveTo(cx + 60, cy + 145, cx - 60, cy + 145, cx - 85, cy + 100);
    g.bezierCurveTo(cx - 125, cy + 30, cx - 80, cy - 30, cx - 50, cy - 75);
    g.bezierCurveTo(cx - 40, cy - 40, cx - 20, cy - 30, cx - 15, cy - 55);
    g.bezierCurveTo(cx - 10, cy - 100, cx - 20, cy - 135, cx + 10, cy - 175); g.closePath();
  }
  g.fill();
  // the Chinese character sits on the symbol, in the card colour
  g.fillStyle = el.bg; g.font = '800 150px ' + CJK; g.textAlign = 'center'; g.textBaseline = 'middle';
  g.fillText(el.zh, cx, cy + (el.shape === 'triangle' ? 40 : 6));
  // English word, letter by letter so it is spaced out
  g.font = '500 54px "Cormorant Garamond", Georgia, serif'; g.fillStyle = el.fg;
  const gap = 14, widths = [...el.word].map((ch) => g.measureText(ch).width);
  let x = cx - (widths.reduce((a, b) => a + b, 0) + gap * (widths.length - 1)) / 2;
  [...el.word].forEach((ch, i) => { g.textAlign = 'left'; g.fillText(ch, x, H * 0.62); x += widths[i] + gap; });
  // a thin rule and a few vertical lines near the bottom, like the poster
  g.fillRect(cx - 40, H * 0.67, 80, 2);
  g.globalAlpha = 0.55;
  for (let i = -5; i <= 5; i++) g.fillRect(cx + i * 14, H * 0.88, 2, 50 + (i % 2 ? 0 : 14));
  g.globalAlpha = 1;
  const tex = new THREE.CanvasTexture(c);
  tex.colorSpace = THREE.SRGBColorSpace; tex.anisotropy = 4;
  return tex;
}

const cards = new THREE.Group();
scene.add(cards);
ELEMENTS.forEach((el, i) => {
  const theta = (i - 2) * ARC_STEP;               // -60, -30, 0, +30, +60 degrees from straight ahead
  const mesh = new THREE.Mesh(new THREE.PlaneGeometry(CARD_W, CARD_H), new THREE.MeshBasicMaterial({ map: drawCard(el), side: THREE.DoubleSide, transparent: true }));
  mesh.position.set(Math.sin(theta) * ARC_R, EYE, -Math.cos(theta) * ARC_R);
  mesh.lookAt(0, EYE, 0);                          // a plain object's +z side turns to face the point we give
  mesh.userData = { baseY: EYE, phase: i * 1.3, id: el.id, home: mesh.position.clone() };
  cards.add(mesh);
});

/* =====================================================================
   PART 3: the garden (the scan) - hidden for now, kept from scan.html for the next steps
   ===================================================================== */
const GARDEN = new THREE.Vector3(-25, 0, 13);
const scan = new SplatMesh({ url: 'assets/china-garden-lod4.ply' });
scan.rotation.x = -Math.PI / 2;
scan.visible = false;
scene.add(scan);

// Same green-ink look as scan.html, but the cloud-edged reveal now spreads outward in a circle from a centre point (scan x, scan y).
const revealProgress = dyno.dynoFloat(0.02);   // 0 = nothing visible, 1.1 = whole garden
const revealTime = dyno.dynoFloat(0);
const revealCX = dyno.dynoFloat(-25), revealCY = dyno.dynoFloat(-13);
scan.objectModifier = dyno.dynoBlock(
  { gsplat: dyno.Gsplat },
  { gsplat: dyno.Gsplat },
  ({ gsplat }) => {
    const d = new dyno.Dyno({
      inTypes: { gsplat: dyno.Gsplat, progress: 'float', time: 'float', cx: 'float', cy: 'float' },
      outTypes: { gsplat: dyno.Gsplat },
      globals: () => [dyno.unindent(/* glsl */ `
        float hash21(vec2 p) { p = fract(p * vec2(123.34, 456.21)); p += dot(p, p + 45.32); return fract(p.x * p.y); }
        float vnoise(vec2 p) {
          vec2 i = floor(p), f = fract(p); f = f * f * (3.0 - 2.0 * f);
          return mix(mix(hash21(i), hash21(i + vec2(1.0, 0.0)), f.x), mix(hash21(i + vec2(0.0, 1.0)), hash21(i + vec2(1.0, 1.0)), f.x), f.y);
        }
        float fbm(vec2 p) { float s = 0.0, a = 0.5; for (int i = 0; i < 4; i++) { s += a * vnoise(p); p *= 2.03; a *= 0.5; } return s; }
      `)],
      statements: ({ inputs, outputs }) => dyno.unindentLines(/* glsl */ `
        ${outputs.gsplat} = ${inputs.gsplat};
        vec3 p = ${inputs.gsplat}.center;
        vec3 c = ${inputs.gsplat}.rgba.rgb;
        float lum = dot(c, vec3(0.299, 0.587, 0.114));
        vec2 q = p.xy - vec2(${inputs.cx}, ${inputs.cy});        // distance from the chosen point, on the ground
        float warp = (fbm(q * 0.07 + vec2(${inputs.time} * 0.05, 0.0)) - 0.5) * 12.0;
        float lead = ${inputs.progress} * 52.0 + warp - length(q);   // above 0 = the cloud edge has reached this splat
        float v = clamp((lum - 0.5) * 1.6 + 0.5, 0.0, 1.0);
        float b = floor(v * 9.0) / 9.0;
        vec3 deep = vec3(0.03, 0.28, 0.24), mid = vec3(0.18, 0.56, 0.36), lime = vec3(0.72, 0.82, 0.22), pale = vec3(0.90, 0.94, 0.84);
        vec3 ramp = b < 0.34 ? mix(deep, mid, b / 0.34) : (b < 0.67 ? mix(mid, lime, (b - 0.34) / 0.33) : mix(lime, pale, (b - 0.67) / 0.33));
        vec3 ink = mix(ramp, c * vec3(0.9, 1.05, 0.9), 0.25);
        vec3 keep = clamp((mix(vec3(lum), c, 1.5) - 0.5) * 1.1 + 0.5, 0.0, 1.0) * vec3(0.93, 1.03, 0.93);
        float veg = smoothstep(-0.02, 0.08, c.g - max(c.r, c.b));
        float ground = 1.0 - smoothstep(0.6, 2.0, p.z);
        ${outputs.gsplat}.rgba.rgb = mix(keep, ink, max(veg, ground * 0.85));
        ${outputs.gsplat}.rgba.a = ${inputs.gsplat}.rgba.a * smoothstep(0.0, 1.2, lead);
      `),
    });
    gsplat = d.apply({ gsplat, progress: revealProgress, time: revealTime, cx: revealCX, cy: revealCY }).gsplat;
    return { gsplat };
  }
);
scan.updateGenerator();

// The reveal needs a centre. World (x, y, z) turns into scan (x, -z) on the ground because the scan is rotated -90 degrees around x.
let reveal = null;
function playReveal(seconds = 10) {
  revealCX.value = VR_START.x; revealCY.value = -VR_START.z;
  reveal = { t: 0, dur: seconds }; revealProgress.value = 0.02; scan.updateVersion();
}

let scanReady = false;
scan.initialized
  .then(() => { scanReady = true; if (phase === 'cards') statusEl.textContent = 'Drag to look around'; })
  .catch((err) => { statusEl.textContent = 'Could not load the scan: ' + err.message; });

/* ---------- picking, teleporting and walking (used in the garden, next steps) ---------- */
const ray = new THREE.Raycaster();
const VR_START = new THREE.Vector3(-17.8, -1.0, 21.0);   // picked earlier in scan.html: the path at the bottom right
let VR_YAW = Math.atan2(-(GARDEN.x - VR_START.x), -(GARDEN.z - VR_START.z));
const marker = new THREE.Mesh(new THREE.SphereGeometry(0.35, 16, 12), new THREE.MeshBasicMaterial({ color: 0xf08a4b, depthTest: false }));
marker.renderOrder = 10; marker.visible = false;
scene.add(marker);

// Scene scale: the scan is shown at SCENE_SCALE times its recorded size, shrunk around the standing point so your feet stay on the ground.
// (?scale=0.6 in the link, or the slider in the garden preview.)
let SCENE_SCALE = 1.5;
{ const s = parseFloat(new URLSearchParams(location.search).get('scale')); if (s > 0.1 && s < 3) SCENE_SCALE = s; }
function applySceneScale() {
  scan.scale.setScalar(SCENE_SCALE);
  scan.position.set((1 - SCENE_SCALE) * VR_START.x, (1 - SCENE_SCALE) * VR_START.y, (1 - SCENE_SCALE) * VR_START.z);
}

// p is the picked point in the scan's own (unscaled) world numbers, the same kind of numbers as before.
function setStart(p, shownAt) {
  VR_START.copy(p);
  VR_YAW = Math.atan2(-(GARDEN.x - p.x), -(GARDEN.z - p.z));
  applySceneScale(); reference.position.copy(p);
  if (shownAt) { marker.position.copy(shownAt); marker.visible = true; }
  statusEl.textContent = 'Picked: x ' + p.x.toFixed(1) + ', y ' + p.y.toFixed(1) + ', z ' + p.z.toFixed(1);
}

let pickMode = false, measureMode = false, downAt = null, measureA = null;
const pickBtn = $('pick'), measureBtn = $('measure');
function setTool(name) {
  pickMode = name === 'pick' && !pickMode; measureMode = name === 'measure' && !measureMode; measureA = null;
  pickBtn.setAttribute('aria-pressed', pickMode ? 'true' : 'false'); measureBtn.setAttribute('aria-pressed', measureMode ? 'true' : 'false');
  if (pickMode) statusEl.textContent = 'Click a spot in the garden (the central pavilion floor, for example)';
  if (measureMode) statusEl.textContent = 'Measure: click the first point, then the second';
}
pickBtn.addEventListener('click', () => setTool('pick'));
measureBtn.addEventListener('click', () => setTool('measure'));
renderer.domElement.addEventListener('pointerdown', (e) => { downAt = { x: e.clientX, y: e.clientY }; });
renderer.domElement.addEventListener('pointerup', (e) => {
  if (phase !== 'garden' || !(pickMode || measureMode) || !downAt || Math.hypot(e.clientX - downAt.x, e.clientY - downAt.y) > 5) return;
  const r = renderer.domElement.getBoundingClientRect();
  ray.setFromCamera(new THREE.Vector2(((e.clientX - r.left) / r.width) * 2 - 1, -((e.clientY - r.top) / r.height) * 2 + 1), camera);
  ray.far = Infinity;
  const hit = ray.intersectObject(scan)[0];
  if (!hit) { statusEl.textContent = 'Nothing hit there, try another spot'; return; }
  if (pickMode) {
    const L = scan.worldToLocal(hit.point.clone());     // back to the scan's own numbers, so the answer does not depend on the scale
    setStart(new THREE.Vector3(L.x, L.z, -L.y), hit.point);
  } else if (!measureA) {
    measureA = hit.point.clone(); marker.position.copy(measureA); marker.visible = true;
    statusEl.textContent = 'Measure: first point set, click the second';
  } else {
    const d = measureA.distanceTo(hit.point), up = Math.abs(hit.point.y - measureA.y);
    statusEl.textContent = 'Distance ' + d.toFixed(2) + ' m, height difference ' + up.toFixed(2) + ' m (at scale ' + SCENE_SCALE.toFixed(2) + ')';
    measureA = null;
  }
});

const rayLine = new THREE.Line(
  new THREE.BufferGeometry().setFromPoints([new THREE.Vector3(), new THREE.Vector3(0, 0, -8)]),
  new THREE.LineBasicMaterial({ color: 0xffffff, transparent: true, opacity: 0.55 })
);
const _o = new THREE.Vector3(), _d = new THREE.Vector3(), _q = new THREE.Quaternion();
function teleportFrom(ctrl) {
  if (phase !== 'garden') return;
  ctrl.getWorldPosition(_o); ctrl.getWorldQuaternion(_q); _d.set(0, 0, -1).applyQuaternion(_q);
  ray.set(_o, _d); ray.far = 40;
  const hit = ray.intersectObject(scan)[0];
  if (hit && hit.point.y < 2) rig.position.set(hit.point.x, hit.point.y, hit.point.z);
}
for (const i of [0, 1]) {
  const ctrl = renderer.xr.getController(i);
  ctrl.add(rayLine.clone());
  ctrl.addEventListener('select', () => teleportFrom(ctrl));
  rig.add(ctrl);
}

const WALK_SPEED = 1.4;
const _fwd = new THREE.Vector3(), _right = new THREE.Vector3(), _up = new THREE.Vector3(0, 1, 0), _from = new THREE.Vector3(), _down = new THREE.Vector3(0, -1, 0);
let groundClock = 0;
function walk(dt) {
  if (phase !== 'garden') return;
  const session = renderer.xr.getSession();
  if (!session) return;
  for (const src of session.inputSources) {
    if (src.handedness !== 'left' || !src.gamepad) continue;
    const sx = src.gamepad.axes[2] || 0, sy = src.gamepad.axes[3] || 0;
    if (Math.hypot(sx, sy) < 0.2) return;

const SESSION_END = 218;

  { t: 3,   voice: 'wood_intro',   text: 'Wood. The element of growth, like bamboo reaching toward the light. Let your body settle. There is nothing to do but breathe.' },
  { t: 14,  voice: 'breath_start', text: 'Breathe in slowly, as the green light gathers toward you. And breathe out, as it drifts away.' },
  { t: 40,  voice: 'scan_feet',    text: 'Now bring your attention to your feet. Notice the ground beneath them. Simply notice, without trying to change anything.' },
  { t: 70,  voice: 'scan_legs',    text: 'Let your attention rise to your legs. Notice any weight, warmth, or stillness.' },
  { t: 100, voice: 'scan_belly',   text: 'Move to your belly. Feel it rise as you breathe in, and settle as you breathe out.' },
  { t: 130, voice: 'scan_chest',   text: 'Now your chest and shoulders. Let the shoulders be heavy, like bamboo leaves resting after a breeze.' },
  { t: 160, voice: 'scan_face',    text: 'Finally, your face and jaw. Let them soften. Let the eyes be quiet.' },
  { t: 190, voice: 'closing',      text: 'Take one more slow breath. When you are ready, let the garden fade, and return.' },
  { t: 200, run: () => bowl(0.5) },

$('vrSlot').appendChild(vrBtn);
renderer.xr.addEventListener('sessionstart', () => {
  controls.enabled = false;
  if (phase === 'cards') { rig.position.set(0, 0, 0); rig.rotation.y = 0; if (!welcomed) welcome(); }
});
renderer.xr.addEventListener('sessionend', () => { setPhase(phase === 'garden' ? 'garden' : 'cards'); });

function resize() {
  const w = stage.clientWidth || window.innerWidth, h = stage.clientHeight || window.innerHeight;
  renderer.setSize(w, h, false);
  camera.aspect = w / h; camera.updateProjectionMatrix();
}
window.addEventListener('resize', resize);
resize();
setPhase('cards');
// ?phase=wood or ?phase=garden opens straight into that place (handy for testing on a desktop)
{ const ph = new URLSearchParams(location.search).get('phase'); if (ph === 'wood' || ph === 'garden') setPhase(ph); }

let last = performance.now(), time = 0;
const _cam = new THREE.Vector3();
renderer.setAnimationLoop((now) => {
  const dt = Math.min(0.05, (now - last) / 1000); last = now; time += dt;
  mistUniforms.time.value = time;
  // the mist sphere follows the viewer so the horizon never gets closer
  camera.getWorldPosition(_cam); mist.position.copy(_cam);

  if (reveal) {
    reveal.t += dt;
    const k = clamp(reveal.t / reveal.dur), e = k * k * (3 - 2 * k);
    revealProgress.value = lerp(0.02, 1.1, e);
    revealTime.value = reveal.t;
    scan.updateVersion();
    if (k >= 1) reveal = null;
  }
  updateNearMist(dt);
  if (phase === 'cards') updateCards(dt);
  else if (phase === 'wood') updateWood(dt);
  else { walk(dt); controls.update(); }
  if (phase !== 'garden') followHead(dt);
  updateBody(dt);
  if (phase !== 'garden' && !renderer.xr.isPresenting) camera.rotation.set(pitch, yaw, 0, 'YXZ');
  renderer.render(scene, camera);
});

window.scan = scan; // for trying things in the browser console
</script>
</body>
</html>
