<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Five Elements Garden - Meditation</title>
<style>
/* Five Elements meditation space (design exploration). Separate from scan.html, which keeps the earlier hot flash prototype. */
:root {
  --ink: #f2f5f6;
  --ink-dim: rgba(242, 245, 246, .76);
  --glass: rgba(20, 27, 32, .5);
  --glass-line: rgba(255, 255, 255, .2);
  --ui: 'Helvetica Neue', Arial, system-ui, sans-serif;
  color-scheme: dark;
}
html, body { height: 100%; margin: 0; background: #0a1112; overflow: hidden; font-family: var(--ui); color: var(--ink); }
#stage { position: fixed; inset: 0; }
#stage canvas { display: block; width: 100%; height: 100%; touch-action: none; cursor: grab; }
.ui { position: fixed; inset: 0; display: flex; flex-direction: column; justify-content: space-between; gap: 12px; padding: 16px; box-sizing: border-box; pointer-events: none; }
.panel { background: var(--glass); border: 1px solid var(--glass-line); -webkit-backdrop-filter: blur(14px); backdrop-filter: blur(14px); }
.top { display: flex; flex-wrap: wrap; justify-content: space-between; align-items: flex-start; gap: 12px; }
.brand { padding: 12px 16px; border-radius: 14px; max-width: 380px; }
.brand h1 { margin: 0; font-size: 20px; font-weight: 400; }
.brand p { margin: 6px 0 0; font-size: 13px; line-height: 1.45; color: var(--ink-dim); }
.seg { display: flex; flex-wrap: wrap; gap: 2px; padding: 4px; border-radius: 999px; }
button { pointer-events: auto; font-family: var(--ui); cursor: pointer; }
.seg button { border: 0; background: transparent; color: var(--ink); padding: 8px 15px; border-radius: 999px; font-size: 13px; font-weight: 500; }
.seg button[aria-pressed="true"] { background: rgba(255, 255, 255, .92); color: #182126; }
.bottom { display: flex; flex-wrap: wrap; align-items: flex-end; gap: 12px; }
.status { padding: 7px 12px; border-radius: 999px; font-size: 12px; color: var(--ink-dim); }
.garden-only { display: none; }
.credit { pointer-events: auto; font-size: 11px; }
.credit a { color: var(--ink); }
input[type=range] { pointer-events: auto; vertical-align: middle; }
#vr { position: static !important; }
@media (max-width: 520px) { .status { display: none; } }
</style>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Ma+Shan+Zheng&text=%E9%87%91%E6%9C%A8%E6%B0%B4%E7%81%AB%E5%9C%9F&display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@500&text=ABCDEFGHIJKLMNOPQRSTUVWXYZ&display=swap" rel="stylesheet">
<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.180.0/examples/jsm/",
    "@sparkjsdev/spark": "https://sparkjs.dev/releases/spark/2.4.0/spark.module.js"
  }
}
</script>
</head>
<body>
<div id="stage"></div>

<main class="ui">
  <header class="top">
    <div class="brand panel">
      <h1>Five Elements Garden</h1>
      <p>A meditation space in the Xgrids scan of the China Garden. Design exploration.</p>
    </div>
    <div class="seg panel" role="group" aria-label="Preview">
      <button type="button" id="phCards" aria-pressed="true">Cards</button>
      <button type="button" id="phWood" aria-pressed="false">Wood session</button>
      <button type="button" id="phFire" aria-pressed="false">Fire session</button>
      <button type="button" id="phGarden" aria-pressed="false">Garden (preview)</button>
      <button type="button" id="replay" class="garden-only">Replay reveal</button>
      <button type="button" id="pick" class="garden-only" aria-pressed="false">Pick VR start</button>
      <button type="button" id="measure" class="garden-only" aria-pressed="false">Measure</button>
      <button type="button" id="person" class="garden-only" aria-pressed="false">1.7 m person</button>
    </div>
  </header>
  <footer class="bottom">
    <div class="status panel garden-only" id="scaleBox">Scene scale <input type="range" id="scale" min="0.3" max="3" step="0.01"> <b id="scaleVal"></b></div>
    <div class="status panel" id="status">Loading scan...</div>
    <div class="status panel credit" id="credit">Body model: <a href="https://sketchfab.com/3d-models/lowpoly-female-body-stylized-57e2dbcff0db468db02ac712eae59070" target="_blank" rel="noopener">Lowpoly Female Body Stylized</a> by Rafasilart, CC BY-NC. Cut into legs and hands.</div>
    <div id="vrSlot"></div>
  </footer>
</main>

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { VRButton } from 'three/addons/webxr/VRButton.js';
import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
import { mergeGeometries } from 'three/addons/utils/BufferGeometryUtils.js';
import { SparkRenderer, SplatMesh, dyno } from '@sparkjsdev/spark';

const $ = (id) => document.getElementById(id);
const stage = $('stage'), statusEl = $('status');
const clamp = (x, a = 0, b = 1) => Math.min(b, Math.max(a, x));
const lerp = (a, b, t) => a + (b - a) * t;

const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
renderer.xr.enabled = true;
stage.appendChild(renderer.domElement);

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x0a1112);
const camera = new THREE.PerspectiveCamera(60, 1, 0.1, 500);
// The camera lives inside a rig so that, in VR, the rig decides where in the world you stand.
const rig = new THREE.Group();
rig.add(camera);
scene.add(rig);

// maxPixelRadius caps how big a single splat may be on screen; very close splats (looking down at the ground) are the heaviest to draw
const spark = new SparkRenderer({ renderer, maxPixelRadius: 160 });
scene.add(spark);

// 'cards' = misty room with five cards, 'wood' = the Wood meditation (scan appears out of the mist),
// 'garden' = a desktop-only overview of the scan for checking and picking points
let phase = 'cards';
let time = 0;   // seconds since the page opened, used by the animations

/* =====================================================================
   PART 1: the misty dream room (no scan here)
   ===================================================================== */
// A big sphere around the viewer, painted by a small program on the graphics card (a fragment shader).
// Think of it as a p5.js draw() that runs once for every pixel, using noise() to get drifting mist.
const mistUniforms = { time: { value: 0 }, dusk: { value: 0 } };
const RIDGES = true;   // faint layered mountain silhouettes on the horizon; set to false for mist only
const mist = new THREE.Mesh(
  new THREE.SphereGeometry(60, 48, 32),
  new THREE.ShaderMaterial({
    uniforms: mistUniforms, side: THREE.BackSide, depthWrite: false,
    vertexShader: /* glsl */ `
      varying vec3 vDir;
      void main() { vDir = position; gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0); }
    `,
    fragmentShader: /* glsl */ `
      varying vec3 vDir;
      uniform float time;
      uniform float dusk;
      float h3(vec3 p) { p = fract(p * 0.3183099 + 0.1); p *= 17.0; return fract(p.x * p.y * p.z * (p.x + p.y + p.z)); }
      float n3(vec3 x) {
        vec3 i = floor(x), f = fract(x); f = f * f * (3.0 - 2.0 * f);
        return mix(mix(mix(h3(i), h3(i + vec3(1,0,0)), f.x), mix(h3(i + vec3(0,1,0)), h3(i + vec3(1,1,0)), f.x), f.y),
                   mix(mix(h3(i + vec3(0,0,1)), h3(i + vec3(1,0,1)), f.x), mix(h3(i + vec3(0,1,1)), h3(i + vec3(1,1,1)), f.x), f.y), f.z);
      }
      float fbm(vec3 p) { float s = 0.0, a = 0.5; for (int i = 0; i < 4; i++) { s += a * n3(p); p *= 2.02; a *= 0.5; } return s; }
      void main() {
        vec3 d = normalize(vDir);
        float horizon = exp(-abs(d.y) * 5.0);
        vec3 col = mix(vec3(0.02, 0.05, 0.06), vec3(0.07, 0.14, 0.15), smoothstep(-0.4, 0.6, d.y));
        col += vec3(0.10, 0.17, 0.16) * horizon * 0.8;
        ${RIDGES ? `
        float az = atan(d.x, d.z);
        for (int k = 0; k < 3; k++) {
          float fk = float(k);
          // cos and sin of the angle make the noise wrap around smoothly, so there is no seam behind your head
          float hgt = 0.12 - fk * 0.04 + 0.12 * n3(vec3(cos(az), sin(az), fk * 0.7) * (2.6 + fk * 1.1));
          vec3 rc = k == 0 ? vec3(0.17, 0.27, 0.27) : (k == 1 ? vec3(0.10, 0.18, 0.19) : vec3(0.05, 0.10, 0.11));
          col = mix(col, rc, 1.0 - smoothstep(hgt - 0.01, hgt + 0.01, d.y));   // edges in rising order: the reverse is undefined in GLSL and some headsets turn it black
        }` : ''}
        // slow drifting mist: noise that is bent by more noise, moving a little each frame
        vec3 q = d * 2.2 + vec3(time * 0.02, time * 0.005, -time * 0.015);
        float n = fbm(q);
        float m = fbm(q * 1.7 + n * 1.5 + 4.0);
        float mistAmt = smoothstep(0.35, 0.78, m);
        col = mix(col, vec3(0.34, 0.46, 0.45), mistAmt * (0.22 + 0.5 * horizon));
        // dusk (the Fire scene): everything warmer, with an orange glow low on the horizon and a purple sky above
        vec3 duskCol = mix(vec3(0.10, 0.05, 0.14), vec3(0.98, 0.50, 0.22), exp(-abs(d.y) * 3.2));
        col = mix(col, col * vec3(1.5, 0.85, 0.65) + duskCol * 0.55, dusk);
        gl_FragColor = vec4(col, 1.0);
      }
    `,
  })
);
mist.renderOrder = -1;
scene.add(mist);

/* =====================================================================
   PART 2: five element cards, drawn on a 2D canvas (like p5.js) and hung in an arc around the viewer
   ===================================================================== */
// sizes are in metres: a card 0.8 m wide and 1.8 m tall hangs 2.4 m away, 30 degrees apart (the first version)
const CARD_W = 0.8, CARD_H = 1.8, ARC_R = 2.4, ARC_STEP = 30 * Math.PI / 180, EYE = 1.5;
// left to right; Wood is in the middle because it is the first one we build.
// Card colours: the second colour of each set on the colour posters (Water, Wood, Metal), plus a softened black for Earth and a softened red for Fire.
const GOLD_A = '#e6c675', GOLD_B = '#b8892f';
const ELEMENTS = [
  { id: 'metal', word: 'METAL', zh: '金', bg: '#CECCD6', dark: false, note: 'Clarity and stillness. A bell that settles the room.' },
  { id: 'water', word: 'WATER', zh: '水', bg: '#003D74', dark: true,  note: 'Flow and release. Ripples that slowly settle.' },
  { id: 'wood',  word: 'WOOD',  zh: '木', bg: '#819D8E', dark: false, note: 'Growth and breath. Bamboo reaching toward the light.' },
  { id: 'fire',  word: 'FIRE',  zh: '火', bg: '#A5473E', dark: true,  note: 'Focus and warmth. A single flame to rest your eyes on.' },
  { id: 'earth', word: 'EARTH', zh: '土', bg: '#3A3735', dark: true,  note: 'Grounding and stability. Solid stone beneath you.' },
];
const BRUSH = '"Ma Shan Zheng", "Xingkai SC", "STXingkai", "Kaiti SC", serif';   // a bold brush font from Google Fonts, loaded in <head>
const SERIF = '"Playfair Display", "Didot", Georgia, serif';                      // high-contrast serif for the English word

// The card outline, like the window shapes on the poster: the top and bottom edges rise in a gentle arch, and the four corners are bitten out by quarter circles.
function cardShape(g, W, H, inset, r, peak) {
  const x0 = inset, y0 = inset, x1 = W - inset, y1 = H - inset, mx = W / 2;
  g.beginPath();
  g.moveTo(x0 + r, y0); g.quadraticCurveTo(mx, y0 - 2 * peak, x1 - r, y0);
  g.arc(x1, y0, r, Math.PI, Math.PI / 2, true);
  g.lineTo(x1, y1 - r); g.arc(x1, y1, r, -Math.PI / 2, Math.PI, true);
  g.quadraticCurveTo(mx, y1 + 2 * peak, x0 + r, y1);
  g.arc(x0, y1, r, 0, -Math.PI / 2, true);
  g.lineTo(x0, y0 + r); g.arc(x0, y0, r, Math.PI / 2, 0, true);
  g.closePath();
}

// Faint ink-wash decoration along the top of each card, in the same tone as the background (pale on dark cards, dark on light ones).
function drawDecor(g, el, W, H) {
  const t = el.dark ? '238,232,215' : '28,48,42';
  const A = (a) => 'rgba(' + t + ',' + a + ')';
  if ('filter' in g) g.filter = 'blur(3px)';
  const leaf = (x, y, len, w, ang, a) => {
    g.save(); g.translate(x, y); g.rotate(ang); g.fillStyle = A(a);
    g.beginPath(); g.moveTo(0, 0); g.quadraticCurveTo(len * 0.5, -w, len, 0); g.quadraticCurveTo(len * 0.5, w, 0, 0); g.fill(); g.restore();
  };
  if (el.id === 'wood') {                       // bamboo leaves hanging from the top corners
    [[30, 50, 200, 28, 0.95, .34], [70, 40, 220, 30, 1.25, .26], [100, 80, 180, 26, 0.7, .30], [40, 110, 160, 22, 1.5, .22],
     [W - 30, 60, 210, 28, 2.2, .32], [W - 70, 40, 220, 30, 1.9, .24], [W - 100, 90, 170, 26, 2.45, .28], [W / 2, 30, 150, 20, 1.6, .18]]
      .forEach((l) => leaf(...l));
  } else if (el.id === 'fire') {                // a setting sun with a few thin clouds
    const sx = W * 0.5, sy = H * 0.19, grad = g.createRadialGradient(sx, sy, 0, sx, sy, 150);
    grad.addColorStop(0, 'rgba(255,215,170,0.55)'); grad.addColorStop(1, 'rgba(255,200,150,0)');
    g.fillStyle = grad; g.fillRect(sx - 150, sy - 150, 300, 300);
    g.fillStyle = 'rgba(255,225,190,0.7)'; g.beginPath(); g.arc(sx, sy, 46, 0, Math.PI * 2); g.fill();
    g.fillStyle = A(0.22); [[0.14, 120], [0.23, 200], [0.29, 90]].forEach(([yy, w], i) => g.fillRect(W * 0.5 - w / 2 + (i - 1) * 50, H * yy, w, 5));
  } else if (el.id === 'earth') {               // weathered garden rocks: three lumpy shapes
    g.fillStyle = A(0.2);
    [[W * 0.28, H * 0.26, 110, 120], [W * 0.62, H * 0.27, 130, 160], [W * 0.82, H * 0.26, 70, 90]].forEach(([cx, base, w, h]) => {
      g.beginPath(); g.moveTo(cx - w / 2, base);
      g.quadraticCurveTo(cx - w * 0.55, base - h * 0.5, cx - w * 0.2, base - h * 0.8);
      g.quadraticCurveTo(cx, base - h * 1.05, cx + w * 0.2, base - h * 0.7);
      g.quadraticCurveTo(cx + w * 0.55, base - h * 0.4, cx + w / 2, base); g.closePath(); g.fill();
    });
    g.fillStyle = A(0.3); [[W * 0.58, H * 0.2], [W * 0.66, H * 0.17], [W * 0.27, H * 0.2]].forEach(([x, y]) => { g.beginPath(); g.ellipse(x, y, 9, 15, 0.4, 0, Math.PI * 2); g.fill(); });
  } else if (el.id === 'water') {               // ripples spreading on the surface
    g.lineWidth = 2.5;
    for (let k = 0; k < 6; k++) { g.strokeStyle = A(0.34 - k * 0.05); g.beginPath(); g.ellipse(W / 2, H * 0.2, 36 + k * 34, 12 + k * 11, 0, 0, Math.PI * 2); g.stroke(); }
  } else {                                      // metal: a bronze singing bowl with sound arcs
    const cx = W / 2, cy = H * 0.2;
    g.fillStyle = A(0.2); g.beginPath(); g.moveTo(cx - 85, cy); g.quadraticCurveTo(cx - 80, cy + 90, cx, cy + 92); g.quadraticCurveTo(cx + 80, cy + 90, cx + 85, cy); g.closePath(); g.fill();
    g.strokeStyle = A(0.35); g.lineWidth = 3; g.beginPath(); g.ellipse(cx, cy, 85, 18, 0, 0, Math.PI * 2); g.stroke();
    g.lineWidth = 2; for (let k = 0; k < 3; k++) { g.strokeStyle = A(0.22 - k * 0.05); g.beginPath(); g.arc(cx, cy + 20, 120 + k * 26, -2.3, -0.84); g.stroke(); }
  }
  if ('filter' in g) g.filter = 'none';
}

// Waves along the bottom edge (the "seigaiha" pattern from the poster): overlapping semicircle scales, drawn from the back row forward.
function drawWaves(g, W, H, bg, dark) {
  g.lineWidth = 1.6; g.strokeStyle = 'rgba(230,198,117,0.75)';
  for (let row = 0; row < 3; row++) {
    for (let col = -1; col < 10; col++) {
      const cx = col * 62 + (row % 2) * 31, cy = H - 60 + row * 22;
      g.fillStyle = bg; g.beginPath(); g.arc(cx, cy, 31, Math.PI, 0); g.fill();
      for (const r of [31, 23, 15, 7]) { g.beginPath(); g.arc(cx, cy, r, Math.PI, 0); g.stroke(); }
    }
  }
}

function paintCard(el) {
  const c = el.canvas, W = c.width, H = c.height, g = c.getContext('2d');
  g.clearRect(0, 0, W, H);
  g.save();
  cardShape(g, W, H, 26, 54, 12); g.clip();
  g.fillStyle = el.bg; g.fillRect(0, 0, W, H);
  // ink-wash feel: big soft pale and dark blotches, then fine paper grain
  for (let i = 0; i < 26; i++) {
    const x = Math.random() * W, y = Math.random() * H, r = 60 + Math.random() * 160, grad = g.createRadialGradient(x, y, 0, x, y, r);
    const light = Math.random() < 0.5;
    grad.addColorStop(0, light ? 'rgba(255,255,255,0.08)' : 'rgba(0,0,0,0.06)'); grad.addColorStop(1, 'rgba(0,0,0,0)');
    g.fillStyle = grad; g.fillRect(x - r, y - r, r * 2, r * 2);
  }
  for (let i = 0; i < 1800; i++) {
    const x = Math.random() * W, y = Math.random() * H, len = 6 + Math.random() * 40;
    g.fillStyle = Math.random() < 0.5 ? 'rgba(255,255,255,' + (0.03 + Math.random() * 0.05) + ')' : 'rgba(0,0,0,' + (0.02 + Math.random() * 0.05) + ')';
    g.fillRect(x, y, len, 1 + Math.random() * 1.2);
  }
  drawDecor(g, el, W, H);
  // the big brush character as the background of the card
  const inkFill = el.dark ? 'rgba(244,238,222,0.9)' : 'rgba(18,28,26,0.88)', inkSolid = el.dark ? '#f4eede' : '#1d2b2a';
  g.fillStyle = inkFill; g.font = '400 ' + Math.round(H * 0.46) + 'px ' + BRUSH; g.textAlign = 'center'; g.textBaseline = 'middle';
  g.fillText(el.zh, W / 2, H * 0.5);
  drawWaves(g, W, H, el.bg, el.dark);
  g.restore();
  // English word, letter by letter so it is spaced out
  g.font = '500 44px ' + SERIF; g.fillStyle = inkSolid; g.textBaseline = 'alphabetic'; g.textAlign = 'left';
  const gap = 18, widths = [...el.word].map((ch) => g.measureText(ch).width);
  let x = W / 2 - (widths.reduce((a, b) => a + b, 0) + gap * (widths.length - 1)) / 2;
  [...el.word].forEach((ch, i) => { g.fillText(ch, x, H * 0.80); x += widths[i] + gap; });
  // gold outline: a thick outer line and a thin inner line
  const gold = g.createLinearGradient(0, 0, W, H); gold.addColorStop(0, GOLD_A); gold.addColorStop(0.5, GOLD_B); gold.addColorStop(1, GOLD_A);
  g.strokeStyle = gold; g.lineWidth = 7; cardShape(g, W, H, 26, 54, 12); g.stroke();
  g.lineWidth = 2.5; cardShape(g, W, H, 42, 42, 10); g.stroke();
  el.tex.needsUpdate = true;
}
function drawCard(el) {
  el.canvas = document.createElement('canvas'); el.canvas.width = 512; el.canvas.height = Math.round(512 * CARD_H / CARD_W);
  el.tex = new THREE.CanvasTexture(el.canvas); el.tex.colorSpace = THREE.SRGBColorSpace; el.tex.anisotropy = 4;
  paintCard(el);
  return el.tex;
}
// the fonts come from the network: once they have arrived, paint every card again
Promise.all([document.fonts.load('600px "Ma Shan Zheng"', '金木水火土'), document.fonts.load('46px "Playfair Display"', 'METALWODFIREARTH')])
  .then(() => ELEMENTS.forEach(paintCard)).catch(() => {});

const cards = new THREE.Group();
scene.add(cards);
ELEMENTS.forEach((el, i) => {
  const theta = (i - 2) * ARC_STEP;               // -60, -30, 0, +30, +60 degrees from straight ahead
  const mesh = new THREE.Mesh(new THREE.PlaneGeometry(CARD_W, CARD_H), new THREE.MeshBasicMaterial({ map: drawCard(el), side: THREE.DoubleSide, transparent: true }));
  mesh.position.set(Math.sin(theta) * ARC_R, EYE, -Math.cos(theta) * ARC_R);
  mesh.lookAt(0, EYE, 0);                          // a plain object's +z side turns to face the point we give
  mesh.userData = { baseY: EYE, phase: i * 1.3, id: el.id, home: mesh.position.clone() };
  cards.add(mesh);
});

/* =====================================================================
   PART 3: the garden (the scan) - hidden for now, kept from scan.html for the next steps
   ===================================================================== */
const GARDEN = new THREE.Vector3(-25, 0, 13);
const scan = new SplatMesh({ url: 'assets/china-garden-lod4.ply' });
scan.rotation.x = -Math.PI / 2;
scan.visible = false;
scene.add(scan);

// Same green-ink look as scan.html, but the cloud-edged reveal now spreads outward in a circle from a centre point (scan x, scan y).
const revealProgress = dyno.dynoFloat(0.02);   // 0 = nothing visible, 1.1 = whole garden
const revealTime = dyno.dynoFloat(0);
const revealCX = dyno.dynoFloat(-25), revealCY = dyno.dynoFloat(-13);
const revealWarm = dyno.dynoFloat(0);   // 0 = the green ink look, 1 = warm dusk colours with deeper reds (Fire)
scan.objectModifier = dyno.dynoBlock(
  { gsplat: dyno.Gsplat },
  { gsplat: dyno.Gsplat },
  ({ gsplat }) => {
    const d = new dyno.Dyno({
      inTypes: { gsplat: dyno.Gsplat, progress: 'float', time: 'float', cx: 'float', cy: 'float', warm: 'float' },
      outTypes: { gsplat: dyno.Gsplat },
      globals: () => [dyno.unindent(/* glsl */ `
        float hash21(vec2 p) { p = fract(p * vec2(123.34, 456.21)); p += dot(p, p + 45.32); return fract(p.x * p.y); }
        float vnoise(vec2 p) {
          vec2 i = floor(p), f = fract(p); f = f * f * (3.0 - 2.0 * f);
          return mix(mix(hash21(i), hash21(i + vec2(1.0, 0.0)), f.x), mix(hash21(i + vec2(0.0, 1.0)), hash21(i + vec2(1.0, 1.0)), f.x), f.y);
        }

  if (phase === 'wood' && p !== 'wood' && woodSession) { woodSession = null; ringState.mode = 'idle'; stopVoices(); setCaption('', ''); particles.visible = false; bamboo.visible = false; fallLeaves.forEach((l) => { l.visible = false; }); windLevel(0, 2); rustleLevel(0); revealProgress.value = 0.02; reveal = null; }
  if (phase === 'fire' && p !== 'fire' && fireSession) clearFire();
  phase = p; phaseChangedAt = time;
  applySceneScale();
  reference.visible = false; personBtn.setAttribute('aria-pressed', 'false');
  mist.visible = p !== 'garden'; cards.visible = p === 'cards'; scan.visible = p !== 'cards';
  [[phCards, 'cards'], [phWood, 'wood'], [phFire, 'fire'], [phGarden, 'garden']].forEach(([b, name]) => b.setAttribute('aria-pressed', p === name ? 'true' : 'false'));
  document.querySelectorAll('.garden-only').forEach((b) => { b.style.display = p === 'garden' ? 'inline-block' : 'none'; });
  controls.enabled = p === 'garden' && !renderer.xr.isPresenting;
  rig.rotation.y = 0; yaw = 0; pitch = 0;
  if (p === 'cards') {
    needAlign = 10;   // once the headset has a pose, turn the rig so the middle card is straight ahead
    resetCards();
    scene.background.set(0x0a1112);
    rig.position.set(0, 0, 0); camera.position.set(0, 1.6, 0);
    statusEl.textContent = 'Click a card, or pinch it in VR';
  } else if (p === 'wood') {
    scene.background.set(0x0a1112);
    rig.position.copy(VR_START); rig.rotation.y = VR_YAW; camera.position.set(0, 1.5, 0);
    statusEl.textContent = scanReady ? 'Drag to look around' : 'Loading scan...';
    startWood();
  } else if (p === 'fire') {
    scene.background.set(0x0a1112);
    rig.position.copy(FIRE_START); rig.rotation.y = FIRE_YAW; camera.position.set(0, 1.5, 0);
    statusEl.textContent = scanReady ? 'Drag to look around' : 'Loading scan...';
    startFire();
  } else {
    scene.background.set(0xe7ddc9);
    rig.position.set(0, 0, 0); camera.position.copy(DESK_POS); controls.update();
    playReveal(10);
    statusEl.textContent = scanReady ? 'Drag to look around, scroll to zoom' : 'Loading scan...';
  }
}
phCards.addEventListener('click', () => setPhase('cards'));
phWood.addEventListener('click', () => { audioInit(); setPhase('wood'); });
phFire.addEventListener('click', () => { audioInit(); setPhase('fire'); });
phGarden.addEventListener('click', () => setPhase('garden'));
$('replay').addEventListener('click', () => playReveal(10));
const scaleEl = $('scale');
function showScale() { scaleEl.value = SCENE_SCALE; $('scaleVal').textContent = SCENE_SCALE.toFixed(2); }
scaleEl.addEventListener('input', () => { SCENE_SCALE = +scaleEl.value; applySceneScale(); showScale(); });
showScale();
const personBtn = $('person');
personBtn.addEventListener('click', () => {
  reference.visible = !reference.visible; personBtn.setAttribute('aria-pressed', reference.visible ? 'true' : 'false');
  reference.position.copy(VR_START);
});

const vrBtn = VRButton.createButton(renderer, { optionalFeatures: ['hand-tracking'] });
$('vrSlot').appendChild(vrBtn);
renderer.xr.addEventListener('sessionstart', () => {
  controls.enabled = false;
  if (phase === 'cards') { rig.position.set(0, 0, 0); rig.rotation.y = 0; needAlign = 10; if (!welcomed) welcome(); }
});
renderer.xr.addEventListener('sessionend', () => { setPhase(phase === 'garden' ? 'garden' : 'cards'); });

function resize() {
  const w = stage.clientWidth || window.innerWidth, h = stage.clientHeight || window.innerHeight;
  renderer.setSize(w, h, false);
  camera.aspect = w / h; camera.updateProjectionMatrix();
}
window.addEventListener('resize', resize);
resize();
setPhase('cards');
// ?phase=wood or ?phase=garden opens straight into that place (handy for testing on a desktop)
{ const ph = new URLSearchParams(location.search).get('phase'); if (ph === 'wood' || ph === 'fire' || ph === 'garden') setPhase(ph); const lp = parseFloat(new URLSearchParams(location.search).get('pitch')); if (Number.isFinite(lp)) pitch = clamp(lp, -1.2, 1.2); const ly = parseFloat(new URLSearchParams(location.search).get('yaw')); if (Number.isFinite(ly)) yaw = ly; }   // ?pitch=-1.1 looks down, ?yaw=0.9 turns left

let last = performance.now();
const _cam = new THREE.Vector3();
renderer.setAnimationLoop((now) => {
  const dt = Math.min(0.05, (now - last) / 1000); last = now; time += dt;
  mistUniforms.time.value = time;
  // dusk and warm colours ease in for Fire and out again afterwards
  mistUniforms.dusk.value += ((phase === 'fire' ? 1 : 0) - mistUniforms.dusk.value) * (1 - Math.exp(-dt * 0.8));
  { const wg = phase === 'fire' ? 1 : 0, dw = (wg - revealWarm.value) * (1 - Math.exp(-dt * 0.8)); if (Math.abs(dw) > 0.001) { revealWarm.value += dw; scan.updateVersion(); } }
  // the mist sphere follows the viewer so the horizon never gets closer
  camera.getWorldPosition(_cam); mist.position.copy(_cam);

  if (reveal) {
    reveal.t += dt;
    const k = clamp(reveal.t / reveal.dur), e = k * k * (3 - 2 * k);
    revealProgress.value = lerp(0.02, 1.1, e);
    revealTime.value = reveal.t;
    scan.updateVersion();
    if (k >= 1) reveal = null;
  }
  updateNearMist(dt);
  checkExit(); updatePrayer(dt);
  if (needAlign > 0 && renderer.xr.isPresenting && phase === 'cards' && --needAlign === 0) faceWorldYaw(0);
  if (phase === 'cards') updateCards(dt);
  else if (phase === 'wood') { updateWood(dt); walk(dt); }
  else if (phase === 'fire') { updateFire(dt); walk(dt); }
  else { walk(dt); controls.update(); }
  if (phase !== 'garden') followHead(dt);
  updateBody(dt);
  if (phase !== 'garden' && !renderer.xr.isPresenting) camera.rotation.set(pitch, yaw, 0, 'YXZ');
  renderer.render(scene, camera);
});

window.addEventListener('keydown', (e) => { if (e.key === 'Escape') exitSession(); });   // on a desktop, Esc leaves a meditation
window.scan = scan; // for trying things in the browser console
</script>
